# =============================================================================
# GAMEPLAY
# =============================================================================
gameplay:
  core_concept: |
    Die Akkhan 6-teilig Bonus lässt Phalanx-Avatare bei jedem Treffer
    automatisch Condemn casten. Das macht hunderte Explosionen pro Sekunde.
    Du musst nur Phalanx aktiv halten und alles explodiert von selbst.

  rotation:
    - step: 1
      action: "Phalanx casten"
      notes: "Avatare spawnen und beginnen sofort Condemn zu casten. Regelmäßig erneuern."

    - step: 2
      action: "Akarat's Champion aktiv halten"
      notes: "Wenn der grüne Balken über dem Skill verschwindet, sofort neu casten. Fast kein Cooldown."

    - step: 3
      action: "Judgment auf Gegner casten"
      notes: "Alle 6 Sekunden erneuern. Debufft alle Gegner im Radius."

    - step: 4
      action: "Laws of Valor aktiv halten"
      notes: "Wie Akarat's Champion - bei Ablauf sofort neu casten."

    - step: 5
      action: "Condemn spammen"
      notes: "Durch Frydehr's Wrath (Cube) kostet Condemn Wrath statt Cooldown. Spam so schnell wie möglich."

    - step: 6
      action: "Justice casten wenn Wrath leer"
      notes: "Generator zum Wrath auffüllen. Nicht zu oft nötig."

  elite_strategy:
    - "Minimum 3 Gegner sammeln bevor Angriff - Blade of Prophecy braucht mehrere Ziele"
    - "Elites mit Judgment debufften und Phalanx drauf schicken"
    - "Gefährliche Elite-Affixe (Illusionist, Shielding, 5er Blaue Packs) - überspringen!"
    - "Stattdessen schnell killbare Elites priorisieren"

  boss_strategy:
    - "Power Pylon für Boss-Kampf aufheben wenn möglich"
    - "In einer Ecke/an der Wand stehen - Avatare stacken sich und casten mehr Condemns auf einen Punkt"
    - "Akarat's Champion aktiv halten - Prophet Rune gibt gratis Auferstehung"
    - "Bei GR 90 ist der Boss-Kill mit Bane of the Powerful sehr schnell"

  tips:
    - "Avatare auf ELITES stellen, nicht auf Trash - Elites triggern mehr Condemn-Procs"
    - "Oculus Ring Circle (+85% Schaden vom Follower) immer betreten"
    - "Traveler's Pledge Bonus: Stehen = mehr Schaden, Laufen = mehr DR"
    - "Shrines immer mitnehmen - Power Shrine für Boss aufsparen"

  common_mistakes:
    - "Akarat's Champion ablaufen lassen - immer im grünen Bereich halten"
    - "Phalanx vergessen zu erneuern - ohne Avatare kein Schaden"
    - "Area Damage auf Gear rollen - wirkt nicht, verschwendet Slot"
    - "Judgment vergessen - ohne Debuff deutlich weniger Schaden"
    - "Zu wenig CDR - Akarat's Champion läuft zu oft ab"

