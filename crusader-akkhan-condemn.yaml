      rune: "Shattering Explosion"
      reason: "Größerer AoE Radius für Trash-Clearing"
    cube_swap:
      jewelry: "In-Geom statt Blade of Prophecy"
      reason: "CDR nach Elite-Kill für schnellere Akarat's Champion Resets"
    notes: "Für maximale Farming-Geschwindigkeit auf T16"

  pushing:
