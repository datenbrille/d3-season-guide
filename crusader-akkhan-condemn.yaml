# Diablo 3 Crusader - Akkhan Condemn Build
# Aktuell für Season 38 (Ethereal Memory)
# Letzte Aktualisierung: 2026-03

build:
  name: "Akkhan Condemn"
  short_name: "AKK Condemn"
  class: "Crusader"
  damage_type: "Holy"
  playstyle: "Melee AoE"
  difficulty: "Easy"

  viable_for:
    speed_farming: true
    gr_pushing: true
    bounties: true
    key_farming: true

  gr_target: 90
  notes: |
    Sehr tanky dank Akarat's Champion (Prophet) - stirbt kaum.
    Phalanx-Avatare casten Condemn automatisch, massiver AoE-Schaden.
    Keine komplexe Rotation, keine Timing-Fenster. Einfachste Mechaniken.
    Boss-Kills bei GR 90 sind schnell - kein Stricken-Gem nötig.

# =============================================================================
# SKILLS
# =============================================================================
skills:
  active:
    - slot: "LMB"
      skill: "Justice"
      rune: "Sword of Justice"
      notes: "Wrath-Generator. Immer casten wenn kein Wrath mehr."

    - slot: "RMB"
      skill: "Condemn"
      rune: "Unleashed"
      notes: "Hauptschaden für GR. Wrath-Spender statt Cooldown (dank Frydehr's Wrath)."
      rune_alternative:
        name: "Shattering Explosion"
        use_case: "T16 Nephalem Rifts - größerer Explosionsradius"

    - slot: "1"
      skill: "Phalanx"
      rune: "Shield Bearers"
      notes: "KERN DES BUILDS. Avatare casten dauerhaft Condemn auf alle Gegner in der Nähe."

    - slot: "2"
      skill: "Judgment"
      rune: "Alle Runen gleichzeitig (Akkhan Bonus)"
      notes: "Debufft alle Gegner im Radius. Alle 6 Sekunden neu casten."

    - slot: "3"
      skill: "Akarat's Champion"
      rune: "Prophet"
      notes: "ÜBERLEBENSWICHTIG. Fast permanente Uptime. Prophet = kostenlose Auferstehung."

    - slot: "4"
      skill: "Laws of Valor"
      rune: "Unstoppable Force"
      notes: "Bufft Angriffsgeschwindigkeit. Long Arm of the Law Passive verlängert Uptime."

  passives:
    required:
      - name: "Fervor"
        effect: "15% CDR + 15% Angriffsgeschwindigkeit (mit 1H-Waffe)"
        notes: "Pflicht für Akarat's Champion Uptime"

      - name: "Finery"
        effect: "~15% mehr Schaden + ~12% Toughness pro Set-Bonus"
        notes: "Stärkster generischer Crusader Passive"

      - name: "Long Arm of the Law"
        effect: "Law-Buff Dauer erhöht"
        notes: "Laws of Valor bleibt länger aktiv"

    recommended:
      - name: "Lord Commander"
        effect: "+Phalanx Schaden, Kosten reduziert"
        notes: "Für mehr Damage. Tauschen gegen Indestructible wenn nötig."

    alternatives:
      - name: "Indestructible"
        effect: "Cheat Death + kurze Unverwundbarkeit"
        notes: "Tauscht gegen Lord Commander wenn du noch stirbst"

